openapi: 3.1.0
info:
  title: TYM Diagram API
  version: 0.9.0
  description: API for generating paper-guided Time Yards Model diagrams and TimeML-style temporal annotations from English or Romanian narrative text.
servers:
  - url: http://127.0.0.1:8765
paths:
  /:
    get:
      operationId: getServiceInfo
      summary: Service metadata and endpoint list
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  extraction:
                    type: string
                  supported_languages:
                    type: array
                    items:
                      type: string
                  endpoints:
                    type: array
                    items:
                      type: string
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
  /v1/books:
    get:
      operationId: listBooks
      summary: List available complete books and chapter metadata, without source text
      description: Optional library metadata without source text. Empty when TYM_LIBRARY_PATH is not configured. Analysis and source reading are public by default; TYM_REQUIRE_LOGIN_FOR_TEXT=true restores confirmed-account-only reading. See docs/book-library-api.md and docs/accounts.md.
      responses:
        "200":
          description: Book metadata and section ranges in UTF-16 code units
          content:
            application/json:
              schema:
                type: object
                required: [books]
                properties:
                  books:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryBook"
  /v1/books/{id}/source:
    get:
      operationId: readBookSource
      summary: Read selected chapter or full source text
      description: Exact cleaned source, no-store, 60 reads per minute per IP. Public for all user types by default. TYM_REQUIRE_LOGIN_FOR_TEXT=true requires a confirmed account instead. Omit sectionId to read the full book.
      security:
        - {}
        - accountBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: sectionId
          schema: { type: string }
      responses:
        "200":
          description: Book source with whole-source hash and half-open UTF-16 range
          content:
            application/json:
              schema:
                type: object
                required: [book_id, language, sha256_utf8, start, end, text]
                properties:
                  book_id: { type: string }
                  section_id: { type: string }
                  language: { type: string, enum: [en, ro] }
                  sha256_utf8: { type: string }
                  start: { type: integer }
                  end: { type: integer }
                  text: { type: string }
        "401": { description: Missing or invalid bearer token when restricted reading is enabled }
        "403": { description: Unconfirmed or revoked account when restricted reading is enabled }
        "404": { description: Unknown book or section }
        "429": { description: Source-reading quota exceeded }
  /v1/account/config:
    get:
      operationId: getAccountConfiguration
      summary: Non-secret availability and Google Web client ID
      responses:
        "200":
          description: enabled, email_enabled, email_delivery (local_test/smtp/unavailable), text_requires_login and optional google_client_id
  /v1/account/register:
    post:
      operationId: registerEmailAccount
      summary: Register an email account and send confirmation
      description: Accounts require confirmation before sign-in. Twenty account requests per five minutes per IP. See docs/accounts.md for provider/storage setup and the remaining standard Identity endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, writeOnly: true }
      responses:
        "200": { description: Account created; confirmation email sent }
        "400": { description: Invalid email or password, or account already exists }
        "429": { description: Account quota exceeded }
        "503": { description: Accounts or email sender not configured }
  /v1/account/login:
    post:
      operationId: signInWithEmail
      summary: Exchange confirmed email credentials for Identity bearer/refresh tokens
      description: Cookie sign-in is not supported. Tokens use the standard Identity accessToken, refreshToken, tokenType and expiresIn response. Refresh request field is refresh_token. Password-reset fields are email, reset_code and new_password, consistent with this API's snake-case JSON policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        "200": { description: Bearer token pair; access expires after 15 minutes }
        "401": { description: Invalid credentials, unconfirmed email or locked account }
        "429": { description: Account quota exceeded }
        "503": { description: Accounts not configured }
  /v1/account/google/nonce:
    post:
      operationId: createGoogleSignInNonce
      summary: Create a single-use five-minute Google sign-in nonce
      responses:
        "200": { description: Object containing nonce }
        "429": { description: Account quota exceeded }
        "503": { description: Google sign-in not configured }
  /v1/account/google:
    post:
      operationId: signInWithGoogle
      summary: Register or sign in using a verified Gmail or Workspace ID token
      description: Official Google signature/audience/issuer/expiry verification plus nonce matching. Uses Google subject, never silently merges by email. No Firebase dependency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, nonce]
              properties:
                credential: { type: string, writeOnly: true }
                nonce: { type: string }
      responses:
        "200": { description: Identity bearer token pair }
        "400": { description: Unsupported or unverified Google account }
        "401": { description: Invalid token or expired/reused nonce }
        "409": { description: Existing account uses another sign-in method }
        "429": { description: Account quota exceeded }
        "503": { description: Google sign-in not configured or unavailable }
  /v1/account/me:
    get:
      operationId: getCurrentAccount
      security:
        - accountBearer: []
      responses:
        "200": { description: Email and confirmation status }
        "401": { description: Invalid bearer token }
        "403": { description: Revoked account session }
  /v1/account/logout:
    post:
      operationId: signOutAccount
      summary: Revoke all sessions for the current account
      security:
        - accountBearer: []
      responses:
        "204": { description: Security stamp updated; clients must discard tokens }
        "401": { description: Invalid bearer token }
        "403": { description: Revoked account session }
  /v1/books/{id}/diagrams:
    post:
      operationId: generateBookDiagram
      summary: Analyze an entire hosted book or its selected chapter/reading section
      description: Shares the normal five-per-IP daily generation quota. Complete hosted books are supported without a per-section character cap. Language is fixed by the book. Book XML exports are omitted to avoid duplicate source payloads. Results may contain excerpts; this is not DRM.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAnalysisRequest"
      responses:
        "200":
          description: Generated book diagram and optional cached density views
          headers:
            X-TYM-Cache:
              description: Optional private SQLite result cache status; requests still count toward the normal quota.
              schema: { type: string, enum: [HIT, MISS, DISABLED] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "400":
          description: Invalid options
        "404":
          description: Unknown book or section
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
  /v1/books/{id}/entities:
    post:
      operationId: recognizeBookEntities
      summary: Recognize entities and references in the selected hosted book section
      description: Shares thirty entity lookups per minute per IP. Selection, language and size rules match book generation; no source text is required in the request.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAnalysisRequest"
      responses:
        "200":
          description: Existing entity/POS/reference response
        "400":
          description: Invalid selection
        "404":
          description: Unknown book or section
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
  /v1/entities:
    post:
      operationId: recognizeEntities
      summary: Recognize entities and resolve references for highlight selection
      description: Local trained English/Romanian spaCy NER supplies complete person, place and organization spans with at least one NOUN or PROPN; internal function words are preserved. Proper-name rules fill uncovered PROPN candidates with explicit provenance, never fragments of any model span. Standalone references require nonpossessive PRON. Conservative two-sentence anaphora remains rule-based; ambiguous, unsupported and quoted references stay unresolved. No LLM. Separate limit of 30 requests per minute per IP; does not consume the diagram quota. Missing Python/runtime/models or a missing NER component returns 503 without an unfiltered fallback. Event, temporal and TimeML extraction are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000000
                  description: Complete current input or selected chapter. Limits and offsets use UTF-16 code units.
                language:
                  type: string
                  enum: [en, ro]
                  default: en
      responses:
        "200":
          description: Named entities with resolved-reference counts, unresolved reference options and UTF-16 mention evidence
          content:
            application/json:
              schema:
                type: object
                required: [language, method, entities, references, pos_filter, ner]
                properties:
                  language:
                    type: string
                  method:
                    type: string
                    const: spacy-trained-ner+pos+rule-anaphora-en-ro-v4
                  ner:
                    type: object
                    required: [provider, model, pipeline_components, raw_entity_counts]
                    properties:
                      provider: { type: string, const: spaCy }
                      model: { type: string }
                      pipeline_components:
                        type: array
                        items: { type: string }
                        description: Active model components; includes ner.
                      raw_entity_counts:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
                        description: All predicted model spans by original label, including classes not offered in the picker. Not accuracy or calibrated confidence.
                  pos_filter:
                    type: object
                    required: [provider, model, allowed_pos, excluded_token_counts]
                    properties:
                      provider:
                        type: string
                        const: spaCy
                      model:
                        type: string
                        examples: [en_core_web_sm/3.8.0, ro_core_news_sm/3.8.0]
                      allowed_pos:
                        type: array
                        items:
                          type: string
                          enum: [PROPN, NOUN, PRON]
                        description: NOUN is eligible only within a trained entity span, not as an arbitrary standalone common noun. Rules require PROPN; unresolved references require PRON.
                      excluded_token_counts:
                        type: object
                        additionalProperties:
                          type: integer
                          minimum: 0
                        description: Input token counts outside eligible POS classes, including EXPLETIVE. Not rejected-entity counts or accuracy measurements.
                  entities:
                    type: array
                    items:
                      type: object
                      required: [name, label, mention_count, span_start, span_end, parts_of_speech, recognition_source]
                      properties:
                        name:
                          type: string
                        label:
                          type: string
                          enum: [PERSON, LOCATION, ORGANIZATION, REFERENCE]
                        recognition_source:
                          type: string
                          enum: [trained_ner, proper_name_rule, unresolved_reference]
                          description: Provenance of the first explicit/selectable occurrence. Not a per-entity confidence score.
                        model_label:
                          type: [string, "null"]
                          description: Original trained label for the first occurrence, such as ORG or ORGANIZATION; null for rule/reference candidates.
                        mention_count:
                          type: integer
                          minimum: 1
                          description: Explicit plus resolved mentions for named entities; literal occurrences for unresolved references.
                        resolved_mention_count:
                          type: integer
                          minimum: 0
                        reference_forms:
                          type: array
                          items:
                            type: string
                        parts_of_speech:
                          type: array
                          minItems: 1
                          items:
                            type: string
                          description: Distinct actual POS classes in the first name span. Trained spans can contain internal ADP, DET or ADJ; rule names require PROPN and unresolved references PRON.
                        span_start:
                          type: integer
                          description: First explicit name/reference start in UTF-16 code units.
                        span_end:
                          type: integer
                          description: First explicit name/reference exclusive end in UTF-16 code units.
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        label:
                          type: string
                          enum: [PERSON, LOCATION, ORGANIZATION, PRONOUN, DEICTIC]
                        span_start:
                          type: integer
                        span_end:
                          type: integer
                        antecedents:
                          type: array
                          items:
                            type: string
                        resolution:
                          type: string
                          description: Explicit-name evidence, applied heuristic, or reason resolution was withheld.
                        part_of_speech:
                          type: string
                          enum: [PROPN, PRON, DET, ADV]
                          description: Model POS of the mention. Resolved possessives/place adverbs may remain evidence without becoming standalone options.
        "400":
          description: Invalid text or language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Entity lookup limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              schema:
                type: integer
                const: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
  /v1/diagrams:
    post:
      operationId: createDiagram
      summary: Generate normalized TYM data and SVG from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramRequest"
      responses:
        "200":
          description: Diagram generated
          headers:
            X-TYM-Cache:
              description: Optional private SQLite result cache status; requests still count toward the normal quota.
              schema: { type: string, enum: [HIT, MISS, DISABLED] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
  /v1/diagrams/svg:
    post:
      operationId: createDiagramSvg
      summary: Generate a TYM SVG directly from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramRequest"
      responses:
        "200":
          description: SVG diagram
          content:
            image/svg+xml:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
  /v1/diagrams/xml:
    post:
      operationId: createDiagramXml
      summary: Generate paper-style TYM XML directly from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramRequest"
      responses:
        "200":
          description: XML notation using TT-SECTION, TIME-SECTION, EP-SECTION, and TS tags
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "503":
          $ref: "#/components/responses/PosTaggingUnavailable"
components:
  securitySchemes:
    accountBearer:
      type: http
      scheme: bearer
      bearerFormat: ASP.NET Core Identity protected token (not JWT)
  responses:
    PosTaggingUnavailable:
      description: Local POS runtime or language model unavailable. For diagrams, applicable when entity highlighting is requested. No unfiltered fallback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimitExceeded:
      description: Daily diagram-generation limit exceeded for the client IP.
      headers:
        Retry-After:
          description: Seconds until this IP partition can acquire another permit.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Maximum requests allowed in the fixed window.
          schema:
            type: integer
            const: 5
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitErrorResponse"
  schemas:
    LibraryBook:
      type: object
      required: [id, label, language, source, character_count, original_character_count, sha256_utf8, sections]
      properties:
        id:
          type: string
        label:
          type: string
        language:
          type: string
          enum: [en, ro]
        source:
          type: string
        character_count:
          type: integer
        original_character_count:
          type: integer
        sha256_utf8:
          type: string
        sections:
          type: array
          items:
            type: object
            required: [id, label, kind, start, end, character_count]
            properties:
              id:
                type: string
              label:
                type: string
              kind:
                type: string
              start:
                type: integer
              end:
                type: integer
              character_count:
                type: integer
    BookAnalysisRequest:
      type: object
      properties:
        section_id:
          type: [string, "null"]
          description: Catalog section ID, or null for the complete book if within the size limit.
        options:
          $ref: "#/components/schemas/DiagramRequest/properties/options"
    DiagramRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Narrative text to analyze.
        options:
          type: object
          additionalProperties: false
          properties:
            layout:
              type: string
              enum:
                - both
                - text_order
                - time_yard
              default: both
            width:
              type: integer
              minimum: 720
              maximum: 2400
              default: 1200
              description: SVG canvas width. Track cells retain readable spacing and wrap onto continuation rows.
            highlight_entities:
              type: array
              items:
                type: string
              description: Characters whose tracks should be emphasized.
            include_debug:
              type: boolean
              default: false
            track_density:
              type: integer
              minimum: 0
              maximum: 100
              default: 50
              description: Track granularity. 0 groups natural tracks by narrative mode and temporal category; 50 preserves actor/perspective grouping; 100 creates one track per temporal segment. Events and segments are retained at every density.
            segmentation_algorithm:
              type: string
              enum: [article_rules, mlnet_logistic, mlnet_perceptron]
              default: article_rules
              description: Temporal-development boundary algorithm, independent of TT density. Context persists across extracted events; punctuation, paragraph breaks and changed entity lists alone do not create TS boundaries. Explicit temporal/development shifts delimit contexts; optional ML.NET models classify weaker tense candidates from 48 authored temporal-feature seed rows, not a validated narrative corpus. Applies to English and Romanian.
            cache_track_densities:
              type: boolean
              default: false
              description: Compute cached views for 10, 20, ..., 100 from one NLP analysis. One request consumes one daily permit.
            progressive_density_cache:
              type: boolean
              default: false
              description: Return the selected density first, with a density_cache.session_id and pending_densities. Fetch each remaining layout from GET /v1/density-sessions/{id}/{density}. Sessions are IP-bound, memory-bounded and expire after ten idle minutes. Layouts have a separate 60/minute/IP limit and do not consume daily generation permits.
            language:
              type: string
              enum:
                - en
                - ro
              default: en
              description: Extraction language. Use `ro` for Romanian narrative text.
    DiagramResponse:
      type: object
      required:
        - id
        - model_version
        - diagram
        - analysis
        - render
        - xml
        - warnings
      properties:
        id:
          type: string
        model_version:
          type: string
        segmentation:
          $ref: "#/components/schemas/SegmentationInfo"
        density_cache:
          $ref: "#/components/schemas/DensityCacheInfo"
        track_generation:
          type: object
          properties:
            density:
              type: integer
              minimum: 0
              maximum: 100
            title_method:
              type: string
              const: extractive-event-summary-v1
        warnings:
          type: array
          items:
            type: string
        diagram:
          type: object
          required:
            - actors
            - locations
            - entity_mentions
            - events
            - tracks
            - segments
            - endpoints
            - relations
            - boundaries
            - time_ml
          properties:
            actors:
              type: array
              items:
                $ref: "#/components/schemas/TimeActor"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/TimeLocation"
            entity_mentions:
              type: array
              items:
                $ref: "#/components/schemas/EntityMention"
            events:
              type: array
              items:
                $ref: "#/components/schemas/NarrativeEvent"
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/TimeTrack"
            segments:
              type: array
              items:
                $ref: "#/components/schemas/TimeSegment"
            endpoints:
              type: array
              items:
                $ref: "#/components/schemas/Endpoint"
            relations:
              type: array
              items:
                $ref: "#/components/schemas/TimeRelation"
            boundaries:
              type: array
              items:
                $ref: "#/components/schemas/SegmentBoundary"
            time_ml:
              $ref: "#/components/schemas/TimeMlDocument"
        analysis:
          $ref: "#/components/schemas/AnalysisReport"
        render:
          type: object
          required:
            - format
            - width
            - height
            - svg
          properties:
            format:
              type: string
              const: svg
            width:
              type: integer
            height:
              type: integer
            svg:
              type: string
              description: Self-contained SVG with wrapped time tracks, mode/endpoint icons, an embedded legend, and complete track/segment content. Large text-order overviews sample evenly spaced segment IDs. Track groups expose data-track-id, data-y, and data-height for client-side navigation.
        xml:
          type: string
          description: Paper-style XML notation with TA, TL, EVENT, TT, TREL/TIME, ENDPOINT, POINT, and inline TS elements.
    DensityCacheInfo:
      type: object
      required: [options, views]
      properties:
        options:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [density, view_id, track_count]
            properties:
              density:
                type: integer
                minimum: 0
                maximum: 100
              view_id:
                type: string
                description: base reuses the primary response; other IDs reference entries in views. Multiple densities may share an ID.
              track_count:
                type: integer
                minimum: 0
        views:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CachedDensityView"
        session_id:
          type: string
        pending_densities:
          type: array
          items:
            type: integer
    CachedDensityView:
      type: object
      required: [tracks, segment_placements, endpoints, relations, boundaries, analysis, render, xml, warnings]
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TimeTrack"
        segment_placements:
          type: array
          description: Merge by segment ID into primary diagram.segments. Other segment/event/TimeML fields are shared, not recomputed.
          items:
            type: object
            required: [id, track_id, story_order]
            properties:
              id:
                type: string
              track_id:
                type: string
              story_order:
                type: number
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/TimeRelation"
        boundaries:
          type: array
          items:
            $ref: "#/components/schemas/SegmentBoundary"
        analysis:
          $ref: "#/components/schemas/AnalysisReport"
        render:
          $ref: "#/components/schemas/DiagramResponse/properties/render"
        xml:
          type: string
        warnings:
          type: array
          items:
            type: string
    AnalysisReport:
      type: object
      required:
        - character_count
        - event_count
        - segment_count
        - track_count
        - relation_count
        - time_ml_event_count
        - time_ml_timex_count
        - time_ml_tlink_count
        - average_event_confidence
        - average_segment_confidence
        - segment_types
        - temporal_categories
        - relation_types
        - entity_mention_labels
        - extraction_sources
        - issues
      properties:
        character_count:
          type: integer
        event_count:
          type: integer
        segment_count:
          type: integer
        track_count:
          type: integer
        relation_count:
          type: integer
        time_ml_event_count:
          type: integer
        time_ml_timex_count:
          type: integer
