    SegmentationInfo:
      type: object
      required: [algorithm, model_version, score_kind, training_examples, training_source, decisions, unit]
      properties:
        unit:
          type: string
          enum: [temporal_development]
        algorithm:
          type: string
          enum: [article_rules, mlnet_logistic, mlnet_perceptron]
        model_version: { type: string }
        score_kind:
          type: string
          enum: [rule, uncalibrated_probability, margin]
        training_examples: { type: integer, minimum: 0 }
        training_source: { type: string }
        decisions:
          type: array
          description: One decision per extracted event, before density layout. Scores are raw model predictions, not probabilities of the final guarded boundary. Explicit context shifts force a boundary; lack of temporal/development evidence vetoes one. Scores are null for document start and rules. Margins are not probabilities; logistic probabilities are uncalibrated. Evidence is not causal attribution. Offsets are UTF-16 input/chapter coordinates.
          items:
            type: object
            required: [event_id, previous_event_id, segment_id, span_start, is_boundary, score, evidence, basis, frame, time_reference]
            properties:
              event_id: { type: string }
              previous_event_id: { type: [string, "null"] }
              segment_id: { type: string }
              span_start: { type: integer, minimum: 0 }
              is_boundary: { type: boolean }
              score: { type: [number, "null"] }
              basis:
                type: string
                enum: [document_start, explicit_context_shift, temporal_candidate, temporal_continuity]
              frame:
                type: string
                description: Observed temporal/development context, such as narrative, flashback, prospective, parallel or hypothetical/narrative; not a gold semantic label.
              time_reference:
                type: string
                description: Retained symbolic/calendar reference; an empty string means no supported anchor is known. Relative references are not invented calendar dates.
              evidence:
                type: array
                items: { type: string }
